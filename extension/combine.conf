# Run by the extension as `pipewire -c combine.conf` while sharing is on.
# This small client process adds one virtual output to the running PipeWire
# graph and forwards what it receives to every Bluetooth output. Stopping the
# process removes the output; nothing is written to the user's configuration.
context.properties = { }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "listen_together"
            node.description = "Listen Together"
            combine.latency-compensate = true
            combine.props = {
                audio.position = [ FL FR ]
            }
            stream.rules = [
                {   matches = [
                        {   media.class = "Audio/Sink"
                            node.name = "~bluez_output\\..*"
                        }
                    ]
                    actions = { create-stream = { } }
                }
            ]
        }
    }
]
